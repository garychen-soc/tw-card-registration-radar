id = "taishin"
bank_name = "台新銀行"
domains = ["taishinbank.com.tw"]
note = """官方分 A–I 九個分類，已逐一請求（url_template + category_codes），
實測聯集 98 筆。活動名稱在錨點的 title 屬性裡，錨點文字只是「瞭解詳情」——
所以 link_pattern 用第二個擷取群組取標題。"""

[listing]
kind = "html_list"
entry_url = "https://mkpcard.taishinbank.com.tw/tscccms/promotion/offerList/A"
link_pattern = 'href="([^"]*/tscccms/promotion/detail/WM_\d+)"[^>]*title="([^"]*)"'
url_template = "https://mkpcard.taishinbank.com.tw/tscccms/promotion/offerList/{category}"
category_codes = ["A", "B", "C", "D", "E", "F", "G", "H", "I"]

[detail]
source = "html"
cardinality = "one"

[registration]
portal_url = "https://mkpcard.taishinbank.com.tw/tscccms/signin"
portal_kind = "bank_portal"
portal_hint = "登入台新信用卡活動網站後找到對應活動"
