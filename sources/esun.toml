# 玉山銀行。首版納入的理由：明細頁同時具備秒級時間（實測 21 處）與
# 單頁多子活動（活動一/二/三各有登錄時間），是前身兩個最嚴重缺陷的來源。
#
# 清單不是 JSON API —— 那個端點要 POST 並回傳 HTML 片段，總筆數藏在
# id="total" 裡，總頁數得用「總筆數 ÷ 首頁筆數」推算。
id = "esun"
bank_name = "玉山銀行"
# esun.co 是玉山自己的短網址網域，不是第三方縮網址服務 —— 憑證是 DigiCert EV，
# 主體 O=E.SUN COMMERCIAL BANK, LTD.、統編 86517510。官方活動頁會用它連到
# event.esunbank.com.tw（實測 esun.co/cSgYy → event.esunbank.com.tw/credit/
# concert-presale/index.html），不放進白名單那幾筆會被逐筆略過。
# .co 結尾的短網址是典型釣魚樣式，所以這一筆是查過憑證才加的。
domains = ["esunbank.com.tw", "esunbank.com", "esun.co"]

[listing]
kind = "form_paged"
entry_url = "https://www.esunbank.com/zh-tw/personal/credit-card/discount/shops"
post_url = "https://www.esunbank.com/api/client/CreditCardDiscount/DiscountSearchResult?sc_lang=zh-TW"
item_selector = "div.paginationList"
title_selector = "p.l-cardDiscountAllContent__discount--title"
summary_selector = "p.l-cardDiscountAllContent__discount--word"
link_pattern = 'href="([^"]*shopInfo\?sno=[^"]+)"'
total_pattern = 'id="total"\s+value="(\d+)"'
max_pages = 60

[listing.form_fields]
page = "currentPage"

[listing.form_data]
itemID = "{D594B641-F7C9-458D-AD85-FE9B53220895}"
rootUrl = "/zh-tw/personal/credit-card/discount/shopInfo"
category = ""
keywords = ""

[detail]
source = "html"
cardinality = "many"
boundary = '【活動[一二三四五六七八九十\d]+[^】]{0,20}】'

[registration]
portal_url = "https://www.esunbank.com/zh-tw/personal/credit-card/discount/shops"
portal_kind = "bank_portal"
portal_hint = "於玉山銀行官網活動登錄頁或玉山 Wallet App 登錄"

[conditions]
known_cards = ["玉山Unicard", "玉山Pi拍錢包信用卡"]
