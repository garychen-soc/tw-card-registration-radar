# 凱基銀行。
id = "kgi"
bank_name = "凱基銀行"
domains = ["kgibank.com.tw", "kgibank.com"]
note = """清單頁上有 18 個逐活動網址 /card-campaign/<slug>。我一開始誤判為
「只有分類篩選連結」而用 single_page —— 原因是我的探測用「最常見路徑樣式」
找內容連結，結果被 9 個 ?category= 篩選連結蓋過去。找活動連結應該看
「路徑比清單 URL 更深」的那些。"""

[listing]
kind = "html_list"
entry_url = "https://www.kgibank.com.tw/zh-tw/personal/promotion/card-campaign"
link_pattern = 'href="([^"]*/personal/promotion/card-campaign/[^"?#]+)"'

[detail]
source = "html"
cardinality = "one"

[registration]
portal_url = "https://www.kgibank.com/creditcard/campaign/registrationlist"
portal_kind = "bank_portal"
portal_hint = "於凱基銀行活動登錄清單找到對應活動"
