# 華南銀行。
id = "hncb"
bank_name = "華南銀行"
domains = ["hncb.com.tw"]
note = """entry_url 必須保留完整的 portal 狀態（!ut/p/z1/...）。我曾把它簡化成
/wps/portal/HNCB/card，結果拿到的是不同的頁面 —— 完整 URL 回 199,650 bytes
且含「信用卡」分頁，簡化後只有 138,266 bytes 且分頁不存在。portal／CMS 的
這串編碼是選內容的狀態，不是追蹤雜訊。

「信用卡」分頁面板本身只有活動標題（純文字 806 字），沒有期間也沒有條件 ——
原本用 single_page 讀整塊面板，只產出 1 筆。但面板裡的 44 個連結是**真實 href**
（不是 JS 驅動），而每一個明細頁都是完整靜態 HTML：實測「台灣Pay信用卡繳牌照稅」
5,019 字、4 個期間標籤、8 處「登錄」。改成逐連結讀明細。

三個實測到的取捨：

* 只收 /wps/ 開頭與本行絕對網址的連結。面板裡另有 14 個外部網域（美食網站）
  會被網域白名單擋下，逐筆產生警示；以及 ?1dmy&urile= 開頭的入口頁連結，
  它們解析回同一張導覽頁（3,969 字、0 個期間標籤），只會產出雜訊。
* 期間寫成「自115年4月1日起至115年4月30日止」，民國年與年月日格式解析器都支援。
* 前身在此取得 42 筆，但其中 34 筆沒有結束日、0 筆有登錄時點，且多筆共用同一組
  期間 —— 那是覆蓋率的假象。這裡的每一筆都來自它自己的明細頁。

**入口頁真的很慢，不是被封鎖 —— 已用 CI 探測證實。** 2026-08-06 的 Scrape 執行
在這裡逾時、整個來源歸零（連重試三次都逾時）。用 scripts/probe_source.py 從同一個
Actions runner 試 12 種 UA／標頭組合，**全部 HTTP 200、199,633 bytes**，但平均
每次約 15 秒 —— 本機同一個網址是 0.8–1.9 秒。這是 IBM WebSphere portal 頁面
（199KB、URL 帶一長串 portal 狀態）從美歐機房存取的實際延遲，25 秒的預設值
餘裕太小。

所以覆寫 timeout 而不是換 UA：被拒絕存取會是 403（陽信就是），逾時是另一回事。

90 秒仍然不夠（2026-08-06 的 Scrape 三次重試全逾時）。probe 單獨跑時每次約 15 秒，
但 Scrape 是 6 家銀行並行，網路競爭下會慢好幾倍。已拉到上限 180 秒。

若 180 秒仍不夠，這家該改走自架 runner（住宅 IP 只要 0.8–1.9 秒）—— 分流機制已
實作並測過，改 runner = "self-hosted" 一行即可。"""
timeout_seconds = 180.0

