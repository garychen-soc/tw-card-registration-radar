# 華南銀行。
id = "hncb"
bank_name = "華南銀行"
domains = ["hncb.com.tw"]
transport = "browser"
note = """2026-10-13 重新校準官方入口：1dmy 與 urile 選取 WCM 的 best_offer
內容，必須保留；固定的 !ut/p/z1/... portal 狀態並非必要。只移除狀態 token、
仍保留內容參數的短網址，與原入口的信用卡面板 43 個連結逐項一致。
不能把入口改成完全沒有內容參數的 /wps/portal/HNCB/card，那是卡片產品頁。

只解析「信用卡」分頁面板，並只收本行 /wps/ 活動明細，不把其他業務、外部
優惠網站與導覽分類頁混進來。活動名稱來自連結的 title 屬性，明細內文才是
期間、登錄與條件的依據。

一般 HTTP 在 GitHub 單獨探測可讀，與其他來源一起執行仍可能整個入口逾時。
因此使用標準有視窗 Chromium，保留 45 秒 timeout、正常重試、防護與缺漏回報。
入口及完整來源結果分別核對，不藉由增加 timeout 掩蓋問題。"""
timeout_seconds = 45.0

[listing]
kind = "html_list"
entry_url = "https://www.hncb.com.tw/wps/portal/HNCB/card/?1dmy&urile=wcm%3apath%3a/wps/wcm/connect/hncb_v2/site_map/hncb/per_finance/service/public_item/best_offer"
# 活動全在「信用卡」分頁的面板裡。不限縮會混進存款、貸款、保險等其他分頁的連結。
scope_tab_label = "信用卡"
# 活動名稱在錨點的 title 屬性裡（錨點文字被 CSS 截斷成一行），用第二個擷取
# 群組取出來 —— 與台新同一個手法。
link_pattern = '<a\s+href="(/wps/[^"#?][^"]*|https://www\.hncb\.com\.tw/wps/[^"]+)"[^>]*?title="(?:另開視窗)?連結至([^"]+)"'

[detail]
source = "html"
cardinality = "many"

[registration]
portal_url = "https://netbank.hncb.com.tw/netbank/servlet/TrxDispatcher"
portal_kind = "bank_portal"
portal_hint = "於華南銀行網路銀行的卡片活動登錄頁登錄"
