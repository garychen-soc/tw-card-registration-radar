id = "sunny"
bank_name = "陽信銀行"
domains = ["sunnybank.com.tw"]
# 以正常有視窗 Chromium 在 GitHub Actions 讀取，Linux 使用 Xvfb。
# HTTP User-Agent 矩陣失敗不能證明「所有雲端網路都不可讀」。
runner = "cloud"
transport = "browser"
note = """2026-10-13 的官方頁已有專案活動卡片與逐活動 href，不能再把整個
索引頁當成唯一活動頁。只在 .txt .ad-link 面板收逐活動的 activityevent、
ActNewsView 與首刷禮官方連結，使用卡片標題、清單期間與各自明細內文。
導覽入口（卡組織、紅利兌換、公益、App）不列為活動。

一般 HTTP 的 12 種 UA／標頭與替代官方路徑均回 Cloudflare 403 驗證頁；
標準有視窗 Chromium 在同一 GitHub 受管 Linux runner 成功讀到 39 張卡片。
因此使用 browser transport，不解 CAPTCHA、不登入，也不把驗證頁解析成活動。"""

[listing]
kind = "html_list"
entry_url = "https://www.sunnybank.com.tw/net/Main/Page/6?onews=1"
scope_selector = ".txt .ad-link"
item_selector = "div.card"
title_selector = ".card-title"
summary_selector = ".card-text"
# 只收逐活動官方明細；排除卡組織、紅利兌換、公益與 App 等導覽入口。
link_pattern = 'href="((?:https://www\.sunnybank\.com\.tw)?/(?:activityevent/(?!202010-sunnybank_app/)[^"]+|net/Prg/ActNewsView/\d+|creditcard/wcardinfo/[^"]*))"'

[detail]
source = "html"
cardinality = "many"

[registration]
portal_url = "https://www.sunnybank.com.tw/portal/pt/pt01002/PT01002Index.xhtml"
portal_kind = "bank_portal"
portal_hint = "於陽信銀行網路銀行的活動登錄頁登錄"
