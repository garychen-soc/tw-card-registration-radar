id = "sunny"
bank_name = "陽信銀行"
domains = ["sunnybank.com.tw"]
note = """頁上沒有逐活動網址（只有選單連結），活動內容全在索引頁上，用 single_page。

**封鎖看的是 IP，不是 User-Agent —— 已用 12 種組合的矩陣證偽。**
scripts/probe_source.py 從 Actions runner 試了 6 種真實瀏覽器 UA
（Chrome mac／Windows／Android、Safari、Firefox、專案預設）× 有無完整的
Chrome fetch metadata 與 client hints（sec-fetch-*、sec-ch-ua），
**12 種組合全部 HTTP 403**；同一份矩陣在本機住宅 IP 全部 HTTP 200、
161,393 bytes。

所以已改回專案預設 UA —— 對能讀到的來源保持可識別是對的做法，沒有理由為了一個
量測為假的假設放棄它。

真正的解法是住宅 IP 的自架 runner（ADR 0002 已寫好備案），那需要使用者提供
常開的機器。在那之前這家會誠實地顯示為 blocked：來源狀態面板看得到，
且合計流失僅佔全站 1.6%，不會擋下其餘來源的更新（見 guard 的
UNUSABLE_SHARE_LIMIT）。"""

[listing]
kind = "single_page"
entry_url = "https://www.sunnybank.com.tw/net/Main/Page/6?onews=1"

[detail]
source = "html"
cardinality = "many"

[registration]
portal_url = "https://www.sunnybank.com.tw/portal/pt/pt01002/PT01002Index.xhtml"
portal_kind = "bank_portal"
portal_hint = "於陽信銀行網路銀行的活動登錄頁登錄"
