name: Scrape

# 只抓取並提交資料。不部署 —— 提交會觸發 Deploy。
# 名字說的事就是它做的事。理由見 docs/adr/0002-scrape-runner.md

on:
  schedule:
    # 台北 06:00 / 12:00 / 18:00
    - cron: "0 22,4,10 * * *"
  workflow_dispatch:
    inputs:
      only:
        description: "只跑指定來源（空白＝全部），以空白分隔"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  # 住宅 IP 才讀得到的來源（見各 spec 的 runner 欄位）。目前只有陽信 ——
  # datacenter IP 對它 12 種 UA／標頭組合全部 403，而元大剛好相反（CI 通、
  # 住宅 IP 被 403），所以這是分流而不是「自架比較好」。
  #
  # **只有 schedule 與 workflow_dispatch 會跑這個 job。** 這是公開 repo，
  # 自架 runner 是 GitHub 明確警告的風險 —— fork 的 PR 能在使用者的機器上跑
  # 任意程式。這個 if 是第一道防線，倉庫層的「需要核准才能執行 fork PR」
  # 設定是第二道（見 docs/adr/0002-scrape-runner.md）。
  residential:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, tw-card-radar]
    timeout-minutes: 20
    # 機器離線、睡眠或該次失敗都不該擋下其餘 16 家的更新。
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Scrape the residential-only sources
        run: |
          python scripts/build_site.py \
            --runner self-hosted \
            --today "$(TZ=Asia/Taipei date +%F)" \
            --snapshot-out snapshot/residential.json | tee /tmp/residential.log

      - name: Write run summary
        if: always()
        run: |
          {
            echo "### 自架 runner（住宅 IP）"
            echo '```'
            cat /tmp/residential.log || echo "（沒有輸出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: residential-snapshot
          path: snapshot/residential.json
          retention-days: 1
          if-no-files-found: error

  scrape:
    needs: residential
    # 自架 runner 沒回報時照樣發布 —— 那幾家會以 failed 出現在來源狀態面板。
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      # 頁面 HTML 快取只是省下重新下載，命中與否對正確性零影響。
      # 只有國泰世華與聯邦提供 ETag／Last-Modified，其餘來源每次都會重抓。
      - name: Restore page cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            var/pages
            var/http
          key: pages-${{ github.run_id }}
          restore-keys: pages-

      # 自架 runner 的快照。下載失敗（機器離線、job 沒跑）不視為錯誤 ——
      # build_site.py 會把那批來源記成 failed 並繼續。
      - name: Download the residential snapshot
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: residential-snapshot
          path: snapshot

      - name: Scrape and build data
        id: scrape
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set +e
          # --only 只跑部分來源，產出的 index.json 只含那些來源 ——
          # 提交它會把其餘來源的資料從網站上抹掉。因此 only 模式強制 --dry-run。
          ARGS=(
            --today "$(TZ=Asia/Taipei date +%F)"
            --runner cloud
            --snapshot-in snapshot/residential.json
          )
          if [ -n "$ONLY" ]; then
            # shellcheck disable=SC2206
            ARGS+=(--only $ONLY --dry-run)
            echo "只跑指定來源（$ONLY），強制 dry-run，不會提交。"
          fi
          python scripts/build_site.py "${ARGS[@]}" | tee /tmp/scrape.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Write run summary
        if: always()
        run: |
          {
            echo "### 抓取結果（退出碼 ${{ steps.scrape.outputs.exit_code }}）"
            echo
            echo '```'
            cat /tmp/scrape.log || echo "（沒有輸出）"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 退出碼語意（與 scripts/build_site.py 一致）：
      #   0 全部來源正常  2 部分來源不完整但已通過發布防護  4 發布防護阻擋
      - name: Stop if the publish guard blocked this run
        if: steps.scrape.outputs.exit_code == '4'
        run: |
          echo "::error::發布防護阻擋，未覆寫網站資料。詳見上方摘要。"
          exit 1

      - name: Fail on unexpected exit code
        if: steps.scrape.outputs.exit_code != '0' && steps.scrape.outputs.exit_code != '2' && steps.scrape.outputs.exit_code != '4'
        run: |
          echo "::error::抓取以非預期的退出碼結束：${{ steps.scrape.outputs.exit_code }}"
          exit 1

      - name: Commit the refreshed data
        if: inputs.only == ''
        run: |
          if git diff --quiet -- web/public; then
            echo "資料無變化，不提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/public
          # unique_offers 是實際發布的筆數（去重後），offers 是去重前的抓取量
          # ——後者是涵蓋率防護的比較基準，不是使用者在網站上看到的數字。
          COUNT=$(python -c "
          import json, pathlib
          payload = json.loads(pathlib.Path('web/public/data/index.json').read_text(encoding='utf-8'))
          counts = payload['counts']
          print(counts.get('unique_offers', counts['offers']))
          ")
          git commit -m "chore: refresh promotion data (${COUNT} offers)"
          # 抓取要跑好幾分鐘，期間可能有人推了新的 commit。直接 push 會被
          # 拒絕而丟掉這次的資料（實測發生過）。rebase 後重試。
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push 被拒（第 ${attempt} 次），rebase 後重試"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "::error::連續三次推送失敗，本次資料未提交。"
          exit 1
