# 信用卡活動「登錄時點」golden 集（新管線驗收基準）
#
# 依據：每筆只以官方頁面原文為準（不抄 v1 / Codex 輸出）。原文快照存於
#   /private/tmp/claude-502/-Users-chenzhiming-Documents-Claude/b90211e4-6b90-4ade-9844-7c3a014d6fff/scratchpad/golden_src/<id>.txt
#   （該路徑為暫存區；golden/check.py 以 --src 指定）。抓取日 2026-11-01（台北）。
# 範圍：2026-11-01 00:00 ~ 2026-12-31 23:59（+08:00）內的登錄時點。
#
# 記法約定（與任務說明一致，補充本檔另外採用的幾條）：
#   - 時間只到分鐘並帶 +08:00；原文 23:59:59 記 23:59；原文「24：00」記為次日 00:00 並註明。
#   - start 只寫日期沒寫時刻 → 當天 00:00，note 寫「原文無時刻」。
#   - end 只寫日期（含「至當月月底」「當月底」）→ 該日 23:59，note 註明「截止原文無時刻」。
#   - 官方未寫截止或「額滿為止」→ end: null。
#   - 「遇假日順延」只在條款明寫時套用（假日依 data/holidays/2026.csv）；條款沒寫就照原日期，
#     並在 note 標「條款無順延」。條款同時列舉實際日期時以列舉為準。
#   - 跨越範圍邊界的連續窗口（例如 7/1~12/31、10/26~11/1）照官方原始起訖記錄，
#     check.py 只要求窗口與範圍有交集。
#   - 擴充欄位（選填）：subs[].registration 可覆寫整頁的 registration（同頁混有免登錄子活動時用）；
#     頂層 note 放整筆的判讀說明。period 官方未載時填 null。
#   - registration 值：required（有可落地的時點）／not_required（不需登錄）／
#     unspecified_time（需登錄但官方沒寫具體時點，slots 為空）。

